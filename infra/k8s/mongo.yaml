apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulseboard-mongo
  namespace: pulseboard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: pulseboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulseboard-mongo
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: pulseboard
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
