apiVersion: v1
kind: Secret
metadata:
  name: pulseboard-api
  namespace: pulseboard
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pulseboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: pulseboard-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4200"
            - name: MONGO_URI
              value: mongodb://mongo:27017/pulseboard
            - name: JWT_EXPIRES_IN
              value: 7d
            - name: CORS_ORIGINS
              value: http://localhost:3000
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulseboard-api
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pulseboard
spec:
  selector:
    app: api
  ports:
    - port: 4200
      targetPort: 4200
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: pulseboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
