services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - pulseboard_mongo:/data/db

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: production
      PORT: 4200
      MONGO_URI: mongodb://mongo:27017/pulseboard
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - mongo

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4200/api/v1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4200/api/v1
    depends_on:
      - api

volumes:
  pulseboard_mongo:
